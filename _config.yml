title: 荒岛书生
description: "程序员，文学、古琴、流行音乐、运动爱好者。"
tagline: "程序 · 文字 · 生活"
lang: zh-CN
timezone: Asia/Shanghai
url: "https://www.lidaxiang.cn"
baseurl: ""
theme: jekyll-theme-hydejack
logo: /assets/img/avatar-earth-cat-360.webp

# Keep the original post URLs and excerpt marker.
permalink: /:categories/:title
excerpt_separator: '<!---more--->'
paginate: 15
paginate_path: /page:num/
markdown: kramdown
highlighter: rouge

# Use system fonts so the Chinese reading experience does not depend on Google Fonts.
google_fonts: false
font: 'system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'
font_heading: 'system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif'
accent_image: /assets/img/sidebar-bg.jpg
accent_color: '#4f7779'
theme_color: '#193747'
favicon: /favicon.ico?v=earth-cat-20261101
apple_touch_icon: /assets/apple-touch-icon.png?v=earth-cat-20261101
copyright: '© 2016–2026 荒岛书生。'

author:
  name: 荒岛书生
  picture: /assets/img/avatar-earth-cat-360.webp
  url: https://www.lidaxiang.cn/
  email: lidaxiang0@outlook.com
  about: "程序员，文学、古琴、流行音乐、运动爱好者。"
  social:
    github: 0lidaxiang
    email: lidaxiang0@outlook.com
    rss: https://www.lidaxiang.cn/feed.xml

menu:
  - title: 首页
    url: /
  - title: 技术
    url: /workOutline/
  - title: 生活
    url: /lifeOutline/
  - title: 标签
    url: /tags/
  - title: 联系
    url: /contact/

legal:
  - title: RSS
    url: /feed.xml

# The UA identifier is archived in _data/legacy_analytics.yml.
# Universal Analytics has been retired; it cannot collect new GA4 data.
google_analytics: false

hydejack:
  post_addons: [about, related]
  no_break_layout: true
  no_large_headings: true
  # Local blog-template option; titles remain links to the full articles.
  hide_read_more: true
  no_breadcrumbs: true
  no_search: true
  no_push_state: false
  use_lsi: false
  cookies_banner: false
  dark_mode:
    dynamic: true
    icon: true
  offline:
    enabled: false

plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  style: compressed
  quiet_deps: true
  silence_deprecations: [import, global-builtin, color-functions, slash-div, if-function]

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: contact.md
    values:
      addons: []
      hide_dates: true
  - scope:
      path: about_me_zh.md
    values:
      addons: []
      hide_dates: true
  - scope:
      path: about_me_en.md
    values:
      addons: []
      hide_dates: true
  - scope:
      path: donate.md
    values:
      addons: []
      hide_dates: true

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - CODE_OF_CONDUCT.md
  - vendor
  - scripts
  - tests
  - .migration-work
  - docs
