{% assign counter = site.data.legacy_analytics.flag_counter %}
{% if counter.id and counter.history_url %}
<div class="visitor-counter">
  <a class="external no-push-state" href="{{ counter.history_url }}" aria-label="查看总访问量历史统计（Flag Counter）">
    <img src="{{ counter.image_url }}" alt="总访问量（累计浏览次数）" width="160" height="20" decoding="async">
  </a>
</div>
{% endif %}
